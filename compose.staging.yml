# Staging deployment.
# The service joins the SAME external network that ekoru-gateway-staging uses
# (`ekoru-staging-network`), and is only reachable from inside that network
# under the DNS name `ekoru-image-processor-staging`.
#
# Pre-requisites on the host (once):
#   docker network create ekoru-staging-network    # if it doesn't exist yet
#
# Run with:   docker compose -f compose.staging.yml up -d --build

name: 'ekoru-image-processor-staging'

services:
  ekoru-image-processor-staging:
    image: ekoru-image-processor:staging
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    container_name: ekoru-image-processor-staging
    env_file:
      - .env.staging
    networks:
      - ekoru-staging-network
    # NO `ports:` block — service is only reachable inside the docker network.
    expose:
      - '8090'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:8090/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  ekoru-staging-network:
    external: true
