# Production deployment.
# The service joins the SAME external network that ekoru-gateway uses
# (`ekoru-network`), and is only reachable from inside that network
# under the DNS name `ekoru-image-processor`.
#
# Pre-requisites on the host (once):
#   docker network create ekoru-network    # if it doesn't exist yet
#
# Run with:   docker compose -f compose.prod.yml up -d --build

name: 'ekoru-image-processor-prod'

services:
  ekoru-image-processor:
    image: ekoru-image-processor:prod
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    # docker stop: a small init passes SIGTERM to the app, which finishes its
    # requests and jobs in progress. Docker kills it only after 30 seconds.
    init: true
    stop_grace_period: 30s
    container_name: ekoru-image-processor
    env_file:
      - .env.prod
    networks:
      - ekoru-network
    # NO `ports:` block — service is only reachable inside the docker network.
    expose:
      - '8090'
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:8090/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  ekoru-network:
    external: true
